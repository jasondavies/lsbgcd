name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Verify (build, kernel replay, axiom audit)
        run: python3 scripts/verify.py
